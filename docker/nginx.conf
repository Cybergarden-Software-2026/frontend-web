server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/site;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Docker DNS resolves the Compose service again when the API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/api(?:/|$) {
        set $backend api:8080;
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Pass the streaming preference on to the public reverse proxy as well.
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/(?:reference|data)(?:/|$) {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    location /sounds/ {
        types { audio/wav wav; }
        try_files $uri =404;
    }

    location = /mark.svg {
        try_files $uri =404;
    }

    location = /itsm {
        absolute_redirect off;
        return 302 /itsm/;
    }

    location ^~ /itsm/ {
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /mobile {
        absolute_redirect off;
        return 302 /mobile/;
    }

    location = /mobile/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /mobile/service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/mobile/";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://*.googleapis.com; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # The PWA is a separate build and its worker cannot control the main dashboard.
    location ^~ /mobile/ {
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
