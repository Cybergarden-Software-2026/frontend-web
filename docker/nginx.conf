server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/site;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location ~ ^/api(?:/|$) {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"API недоступен"}';
    }

    location ~ ^/(?:reference|data)(?:/|$) {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    location /sounds/ {
        types { audio/wav wav; }
        try_files $uri =404;
    }

    location = /mark.svg {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
