server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /srv/site;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Docker DNS resolves the Compose service again when the API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ~ ^/api(?:/|$) {
        set $backend api:8080;
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # Pass the streaming preference on to the public reverse proxy as well.
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/(?:reference|data)(?:/|$) {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    location /sounds/ {
        types { audio/wav wav; }
        try_files $uri =404;
    }

    location = /mark.svg {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
