<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2edf7" />
    <title>ITSM — underCtrl</title>
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="stylesheet" href="./itsm.css" />
  </head>
  <body>
    <main class="workspace">
      <section class="integration" aria-labelledby="integration-title">
        <div class="integration-copy">
          <div class="brand">
            <img src="/mark.svg" width="40" height="40" alt="" />
            <span>Under<span class="brand-accent">Ctrl</span></span>
          </div>
          <h1 id="integration-title">Интеграция<br />с ITSM</h1>
          <p>Подключение готовится.</p>
          <a class="return" href="/#incidents">К инцидентам <span aria-hidden="true">↗</span></a>
        </div>
        <div class="integration-art" aria-hidden="true">
          <div class="orbit orbit-outer"></div>
          <div class="orbit orbit-inner"></div>
          <div class="record-stack">
            <div class="record"><i></i><i></i></div>
            <div class="record"><i></i><i></i></div>
            <div class="record"><i></i><i></i></div>
          </div>
          <div class="packet"></div>
        </div>
      </section>
    </main>
  </body>
</html>
