name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run tests
        run: node --run test

      - name: Build production frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_DEMO_API: 'false'
        run: |
          pnpm build
          test -s dist/index.html

      - name: Install mobile PWA dependencies
        working-directory: mobile-web
        run: pnpm install --frozen-lockfile --prod=false

      - name: Test and build mobile PWA
        working-directory: mobile-web
        env:
          APP_BASE_PATH: /mobile/
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm test
          pnpm build
          node tests/render-ui.mjs
          test -s dist/service-worker.js
          test -s dist/manifest.webmanifest

      - name: Check production container and mobile routing
        run: |
          docker build --tag underctrl-frontend:ci .
          docker run -d --name underctrl-ci -p 127.0.0.1:18085:8080 underctrl-frontend:ci
          trap 'docker logs underctrl-ci; docker rm -f underctrl-ci' EXIT
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18085/healthz && break
            sleep 1
          done
          node mobile-web/tests/deployment.mjs http://127.0.0.1:18085
